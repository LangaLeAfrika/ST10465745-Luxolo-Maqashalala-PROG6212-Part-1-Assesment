name: RaceDay CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore RaceDay.Api.Tests/RaceDay.Api.Tests.csproj

      - name: Build
        run: >
          dotnet build RaceDay.Api.Tests/RaceDay.Api.Tests.csproj
          --configuration Release
          --no-restore

      - name: Run tests
        run: >
          dotnet test RaceDay.Api.Tests/RaceDay.Api.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=raceday-tests.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raceday-test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
